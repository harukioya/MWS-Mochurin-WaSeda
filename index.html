<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MWS Mochurin WaSeda — Malware Behavior Trainer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bfd'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='800' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <meta name="description" content="Learn what malware does, one stage at a time — safely. An educational tool by team Mochurin WaSeda for MWS Cup 2026.">
  <!-- No-flash theme init: set data-theme before first paint -->
  <script>
    try {
      var t = localStorage.getItem("mws-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <!-- No webfonts: the app must work offline (BUILD-CONTRACT), and the
       backend's CSP allows only 'self' for styles and fonts. design.css falls
       back to the platform's own faces, which on macOS means Hiragino Sans for
       Japanese and SF Mono/Menlo for code. To use the intended typefaces,
       self-host the woff2 files under styles/ and @font-face them there. -->
  <link rel="stylesheet" href="styles/design.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/" aria-label="Home">
        <span class="brand__mark" aria-hidden="true">M</span>
        <span>Mochurin&nbsp;WaSeda</span>
        <span class="brand__wt" title="working title — name not final">working title</span>
      </a>
      <span class="topbar__spacer"></span>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme">◐&nbsp;Theme</button>
    </div>
  </header>

  <!-- The router renders the active view (home / lesson player / recap) into here. -->
  <main id="app" class="wrap" aria-live="polite"></main>

  <footer class="safety-note">
    <div class="wrap">
      <strong>Safety:</strong> This trainer never runs malware. Every lesson is built from
      pre-captured sandbox behavior (or clearly-labelled synthetic examples); nothing is executed on your machine.
      <span class="mono">· MWS Cup 2026 · team Mochurin WaSeda</span>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
