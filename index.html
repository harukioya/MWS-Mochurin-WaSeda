<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zip2Learn — ZIP から作る DFIR・静的解析演習</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bfd'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='800' fill='white' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
  <meta name="description" content="Zip2Learn：ZIP ファイルを展開・実行せずに読み取り、証拠付きの DFIR・静的解析演習を作る教育用ツール。早稲田大学のチーム Mochurin WaSeda が MWS Cup 2026 に向けて作成。">
  <!-- No-flash theme init: set data-theme before first paint -->
  <script>
    try {
      var t = localStorage.getItem("zip2learn-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <!-- No webfonts: the app must work offline (no request leaves the machine
       while it is used), and the
       backend's CSP allows only 'self' for styles and fonts. design.css falls
       back to the platform's own faces, which on macOS means Hiragino Sans for
       Japanese and SF Mono/Menlo for code. To use the intended typefaces,
       self-host the woff2 files under styles/ and @font-face them there. -->
  <link rel="stylesheet" href="styles/design.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/" aria-label="ホーム">
        <span class="brand__mark" aria-hidden="true">Z</span>
        <span>Zip2Learn</span>
      </a>
      <span class="topbar__spacer"></span>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="配色を切り替え">◐&nbsp;配色</button>
    </div>
  </header>

  <!-- The router renders the active view (home / lesson player / recap) into here. -->
  <main id="app" class="wrap" aria-live="polite"></main>

  <footer class="safety-note">
    <div class="wrap">
      <span class="mono">MWS Cup 2026 · 早稲田大学 チーム Mochurin WaSeda</span>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
